name: tests-and-offline-demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m strategy_lab --real --output local-runs/ci-real
      - run: python -m strategy_lab --output local-runs/ci-synthetic
      - run: python -m strategy_lab.commodities --fixture --output local-runs/ci-commodities
      - run: python examples/explain_nav_transfer.py
      - run: python examples/explain_accounting.py
      - run: python examples/explain_futures_account.py
      - run: python examples/explain_curve_signals.py
      - run: python -m strategy_lab.commodities.research_report --fixture --output local-runs/ci-curve-research
      - run: python -m strategy_lab.commodities.research_report --fixture --policy persistent --output local-runs/ci-exit-priority
