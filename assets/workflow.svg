<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Four separate clocks</title><desc id="desc">Observation t; assumed publication completion after one full intervening session; frozen request at 11 AM on t plus two sessions; unknown closing NAV posts the transfer. Exact historical publication times are unavailable.</desc><rect width="1200" height="410" rx="14" fill="#f5f1e9"/><text x="42" y="62" font-family="Georgia,serif" font-size="34" fill="#101928">A price date is not a permission to trade at that price.</text><path d="M82 141H1116" stroke="#b6ad9e" stroke-width="2"/>
<g font-family="Arial,sans-serif"><g fill="#167d8d"><circle cx="92" cy="141" r="9"/><circle cx="362" cy="141" r="9"/><circle cx="647" cy="141" r="9"/><circle cx="932" cy="141" r="9"/></g><g fill="#101928" font-size="26"><text x="57" y="204">Observe</text><text x="322" y="204">Allow publication</text><text x="607" y="204">Request</text><text x="892" y="204">Post</text></g><g fill="#566473" font-size="23"><text x="57" y="244">NAV through t</text><text x="322" y="244">Full session t+1</text><text x="607" y="244">t+2 at 11:00 ET</text><text x="892" y="244">t+2 closing NAV</text><text x="57" y="283">Past-only features</text><text x="322" y="283">Then freeze targets</text><text x="607" y="283">Percentages known</text><text x="892" y="283">Units assigned later</text></g><text x="42" y="365" font-size="22" fill="#8a6037">Modeled availability and ordinary processing; current-vintage history remains a limitation.</text></g></svg>
