<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="435" viewBox="0 0 1200 435" role="img" aria-labelledby="title desc"><title id="title">Research workflow</title><desc id="desc">1. Validate market: Raw closes, events, sessions and annual cash rates.; 2. Form decisions: Lagged momentum, weight caps and covariance risk scaling.; 3. Schedule execution: Freeze weights for a later close; size from observed NAV.; 4. Fund the account: Sell first, constrain buys, accrue cash and receivables.; 5. Reconcile every day: Bridge stock P&amp;L, entitlements, interest and trading fees.; 6. Evaluate fixed cases: Compare controls, cost and delay without reselection.</desc><rect width="1200" height="435" rx="16" fill="#f3f6f9" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#668096" /></marker></defs><text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#20364c" font-weight="700">From input contract to documented conclusion</text><rect x="20" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="40" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">01  VALIDATE MARKET</text><text x="40" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Raw closes, events, sessions and</text><text x="40" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">annual cash rates.</text><rect x="420" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="440" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">02  FORM DECISIONS</text><text x="440" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Lagged momentum, weight caps and</text><text x="440" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">covariance risk scaling.</text><rect x="820" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="840" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">03  SCHEDULE EXECUTION</text><text x="840" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Freeze weights for a later close;</text><text x="840" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">size from observed NAV.</text><rect x="820" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="840" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">04  FUND THE ACCOUNT</text><text x="840" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Sell first, constrain buys,</text><text x="840" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">accrue cash and receivables.</text><rect x="420" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="440" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">05  RECONCILE EVERY DAY</text><text x="440" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Bridge stock P&amp;L, entitlements,</text><text x="440" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">interest and trading fees.</text><rect x="20" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="40" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">06  EVALUATE FIXED CASES</text><text x="40" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Compare controls, cost and delay</text><text x="40" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">without reselection.</text><line x1="383" y1="138" x2="413" y2="138" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="783" y1="138" x2="813" y2="138" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="1000" y1="199" x2="1000" y2="255" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="813" y1="319" x2="783" y2="319" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="413" y1="319" x2="383" y2="319" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><text x="30" y="414" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526b80" font-weight="400">Inputs, timing assumptions and evidence remain explicit at every stage.</text></svg>